# ============================================================================
# ntplite - .github/workflows/ci.yml
# ----------------------------------------------------------------------------
# The main continuous integration pipeline.
#
# Design goals
#   * every job is deterministic: no test reaches out to the internet unless
#     NTP_LITE_ONLINE_TESTS is explicitly enabled;
#   * the compiler matrix spans both target families (MSVC + GCC + Clang) at
#     both optimisation levels, so "works on my machine" stays rare;
#   * warnings are errors, sanitizers run on Linux, formatting is gated.
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Linux: GCC and Clang, Debug and Release.
  # ubuntu-22.04 is pinned on purpose - it matches the reference development
  # machine (Ubuntu 22.04 / gcc 11 / cmake 3.22).
  # -------------------------------------------------------------------------
  linux:
    name: linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      # The cross-validation test (ntplite.cross_validation) drives the built
      # tool from Python, so the interpreter is pinned rather than assumed.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show toolchain versions
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          ${CXX} --version | head -n 1
          cmake --version | head -n 1
          python3 --version

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DNTP_LITE_WERROR=ON
          -DNTP_LITE_BUILD_TOOLS=ON
          -DNTP_LITE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # Linux with AddressSanitizer + UndefinedBehaviorSanitizer.
  # -------------------------------------------------------------------------
  sanitizers:
    name: linux / clang / asan+ubsan
    runs-on: ubuntu-22.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DNTP_LITE_WERROR=ON
          -DNTP_LITE_SANITIZE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # -------------------------------------------------------------------------
  # Windows: Visual Studio 2022, Debug and Release.
  # -------------------------------------------------------------------------
  windows:
    name: windows / msvc / ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DNTP_LITE_WERROR=ON
          -DNTP_LITE_BUILD_TOOLS=ON
          -DNTP_LITE_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  # -------------------------------------------------------------------------
  # Formatting.  clang-format is pinned so that the check cannot start failing
  # because a runner upgraded its toolchain; version 19.1.7 matches the
  # reference development machine.
  # -------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        run: python -m pip install --disable-pip-version-check clang-format==19.1.7

      - name: Check formatting
        run: python scripts/format.py --check

  # -------------------------------------------------------------------------
  # Repository hygiene: the version must be declared identically everywhere.
  # -------------------------------------------------------------------------
  hygiene:
    name: version hygiene
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: python scripts/check_version_sync.py

  # -------------------------------------------------------------------------
  # Packaging: install into a scratch prefix and consume it from a separate
  # CMake project via find_package().  This is what downstream users do, so
  # it gets exercised on every push.
  # -------------------------------------------------------------------------
  package:
    name: install / find_package consumer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure, build and install ntplite
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${PWD}/_install" \
            -DNTP_LITE_BUILD_TOOLS=OFF \
            -DNTP_LITE_BUILD_EXAMPLES=OFF \
            -DNTP_LITE_BUILD_TESTS=OFF
          cmake --build build --parallel
          cmake --install build

      - name: Build the external consumer project
        run: |
          cmake -S tests/consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${PWD}/_install"
          cmake --build consumer-build --parallel

      - name: Run the consumers
        run: |
          ./consumer-build/consumer_cpp
          ./consumer-build/consumer_c
